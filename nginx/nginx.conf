# Production reverse proxy: serves the static frontend and proxies /api to
# the backend container. Upstream "backend" resolves on the internal Docker
# network, so the backend and Postgres are never exposed publicly.
#
# TLS is expected to be terminated in front of this proxy (external reverse
# proxy / firewall / cloud load balancer). The backend must then see the
# original scheme via X-Forwarded-Proto, and COOKIE_SECURE=true applies once
# the public origin is served over HTTPS.

server {
  listen 80;
  server_name _;

  # Static frontend build.
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 60m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # SPA fallback: all non-API routes serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API reverse proxy.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }
}