services:
  postgres:
    image: postgres:16-alpine
    container_name: bazar-survey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: survey
      POSTGRES_DB: bazar_survey
    ports:
      - "5432:5432"
    volumes:
      - bazar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey -d bazar_survey"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bazar_pgdata: