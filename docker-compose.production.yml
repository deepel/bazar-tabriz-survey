# ============================================================================
# Production stack for Bazar Tabriz Survey.
#   cp .env.production.example .env.production   # then fill in real secrets
#   docker compose -f docker-compose.production.yml up -d --build
#
# Topology:
#   frontend (nginx, public :80, reverse proxy)
#       └── backend (node, internal network only — NOT publicly exposed)
#             └── postgres (internal network only — NOT publicly exposed)
#
# All secrets come from the single gitignored `.env.production` via env_file.
# Compose never interpolates secrets: the postgres healthcheck reads them from
# the container environment with $$ (escaped) expansion.
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - bazar_pgdata:/var/lib/postgresql/data
    networks:
      - bazar
    # Postgres is NOT exposed on the host; only the backend reaches it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bazar
    # Backend is NOT exposed on the host; only nginx reaches it.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bazar
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  bazar_pgdata:

networks:
  bazar:
    driver: bridge